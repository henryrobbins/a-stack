[project]
name = "a-stack-api"
version = "0.1.0"
description = "FastAPI service for a-stack: chat and structured output."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi[standard]>=0.142.2",
    "jinja2>=3.1.6",
    "postgrest>=2.31.0",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "supabase>=2.31.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# supabase-py passes deprecated arguments to its own sub-clients.
filterwarnings = ["ignore::DeprecationWarning:supabase._async.client"]
